name: newfile
on:
  workflow_dispatch: 

jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
      - name: code get
        uses: actions/workflow@v4

      - name: login to dockerhub
        uses: docker/login-action@v4
        with:
         username: ${{ vars.variable }}
         password: ${{ secrets.secret }}

      - name: build and push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ vars.variable }}/my-app:${{github.sha}}
        
